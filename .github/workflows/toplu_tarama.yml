name: Toplu Tarama

on:
  workflow_dispatch:
    inputs:
      esik:
        description: 'Skor eşiği (örn. 0.55)'
        required: false
        default: '0.55'

permissions:
  contents: write

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy pandas-ta-classic lightgbm scikit-learn yfinance requests joblib pyarrow
      - name: Toplu tarama calistir
        env:
          TARAMA_ESIK: ${{ github.event.inputs.esik || '0.55' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python toplu_tarama.py
      - name: Pozisyon durumunu kaydet
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          [ -f acik_pozisyonlar.json ] && git add acik_pozisyonlar.json
          [ -f pozisyon_gecmisi.csv ] && git add pozisyon_gecmisi.csv
          git commit -m "Pozisyon durumu guncellendi" || echo "Degisiklik yok"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && break
            echo "Push basarisiz, tekrar deneniyor ($i)..."
            sleep 5
          done