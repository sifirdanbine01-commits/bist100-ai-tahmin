name: Toplu Tarama

on:
  workflow_dispatch:
    inputs:
      esik_olasilik:
        description: 'Minimum basari olasiligi (0-1 arasi, orn: 0.55)'
        required: false
        default: '0.55'

permissions:
  contents: read

jobs:
  tarama:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy lightgbm scikit-learn joblib requests pandas_ta_classic
      - name: Taramayi calistir
        env:
          TARAMA_ESIK_OLASILIK: ${{ github.event.inputs.esik_olasilik }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tarama.py