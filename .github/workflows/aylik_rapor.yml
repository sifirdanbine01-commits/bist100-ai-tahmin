name: Aylik Islem Raporu

on:
  schedule:
    - cron: '0 7 1 * *'
  workflow_dispatch:
    inputs:
      yil:
        description: 'Yıl (boş bırakılırsa bu ay)'
        required: false
        default: ''
      ay:
        description: 'Ay (1-12, boş bırakılırsa bu ay)'
        required: false
        default: ''

jobs:
  rapor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Turkce karakter destekli font kur
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-dejavu-core
      - run: pip install pandas reportlab requests
      - name: Aylik rapor olustur
        env:
          RAPOR_YIL: ${{ github.event.inputs.yil }}
          RAPOR_AY: ${{ github.event.inputs.ay }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python aylik_rapor.py
