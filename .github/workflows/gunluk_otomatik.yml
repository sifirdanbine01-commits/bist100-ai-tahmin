name: Gunluk Otomatik Kontrol

on:
  schedule:
    - cron: '0 5 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  otomatik_kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pandas numpy pandas-ta-classic lightgbm scikit-learn yfinance requests joblib pyarrow

      - name: Otomatik guncelleme dene
        env:
          HEDEF_TARIH: ''
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python guncelle.py

      - name: Sonuclari kaydet
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          [ -f durum.json ] && git add durum.json
          [ -f guncel_veri.parquet ] && git add guncel_veri.parquet
          [ -f model_siniflandirma.pkl ] && git add model_siniflandirma.pkl
          [ -f model_regresyon.pkl ] && git add model_regresyon.pkl
          [ -f model_hedef1.pkl ] && git add model_hedef1.pkl
          [ -f model_hedef2.pkl ] && git add model_hedef2.pkl
          [ -f model_hedef3.pkl ] && git add model_hedef3.pkl
          [ -f sorgu_gecmisi.csv ] && git add sorgu_gecmisi.csv
          git commit -m "Otomatik gunluk guncelleme" || echo "Degisiklik yok"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && break
            echo "Push basarisiz, tekrar deneniyor ($i)..."
            sleep 5
          done