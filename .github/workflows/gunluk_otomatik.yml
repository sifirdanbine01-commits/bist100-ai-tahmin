name: Gunluk Otomatik Kontrol

on:
  schedule:
    - cron: '0 5 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  otomatik_kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pandas numpy pandas-ta-classic lightgbm scikit-learn yfinance requests joblib pyarrow

      - name: Otomatik guncelleme dene
        env:
          HEDEF_TARIH: ''
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python guncelle.py

      - name: Sonuclari kaydet
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add durum.json guncel_veri.parquet model_siniflandirma.pkl model_regresyon.pkl
          git add model_hedef1.pkl model_hedef2.pkl model_hedef3.pkl 2>/dev/null || true
          git add sorgu_gecmisi.csv 2>/dev/null || true
          git commit -m "Otomatik gunluk guncelleme" || echo "Degisiklik yok"
          git push || echo "Push edilecek bir sey yok"
