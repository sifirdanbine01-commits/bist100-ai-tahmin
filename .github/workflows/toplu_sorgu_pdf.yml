name: Toplu Sorgu PDF

on:
  workflow_dispatch:
    inputs:
      esik:
        description: 'Skor eşiği (örn. 0.55)'
        required: false
        default: '0.55'
      min_rr:
        description: 'Minimum R/R oranı (örn. 1.5)'
        required: false
        default: '1.5'

jobs:
  pdf_rapor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Turkce karakter destekli font kur
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-dejavu-core
      - run: pip install pandas numpy pandas-ta-classic lightgbm scikit-learn yfinance requests joblib pyarrow shap reportlab
      - name: PDF rapor olustur
        env:
          TARAMA_ESIK: ${{ github.event.inputs.esik || '0.55' }}
          MIN_RR: ${{ github.event.inputs.min_rr || '1.5' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python toplu_sorgu_pdf.py
